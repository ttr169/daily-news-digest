name: 全球宏观+地缘 24h 简报

on:
  # 每天东京时间 08:30（= UTC 前一日 23:30）
  schedule:
    - cron: '30 23 * * *'
  # 允许在 Actions 页面手动触发（右上角 Run workflow）
  workflow_dispatch:

# 同一时刻只允许一个实例，避免手工触发与定时撞车
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write   # 归档报告回仓库
  issues: write     # 失败时自动开 Issue

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # continue-on-error：即使邮件投递失败，也要保证「归档」这一步照常执行
      - name: 生成简报并投递
        id: run_digest
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY:   ${{ secrets.TAVILY_API_KEY }}
          QQ_SMTP_USER:     ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_CODE:     ${{ secrets.QQ_SMTP_CODE }}
          MAIL_TO:          ${{ secrets.MAIL_TO }}
        run: python digest.py

      - name: 归档当日报告
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ || true
          if git diff --cached --quiet; then
            echo "无新增归档，跳过提交。"
          else
            git commit -m "chore: archive $(date -u +%Y-%m-%d) digest"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # 失败告警：静默失败比失败本身更糟，这一步保证你一定会知道
      - name: 失败告警（邮件 + Issue）
        if: steps.run_digest.outcome == 'failure'
        env:
          QQ_SMTP_USER: ${{ secrets.QQ_SMTP_USER }}
          QQ_SMTP_CODE: ${{ secrets.QQ_SMTP_CODE }}
          MAIL_TO:      ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notify_failure.py
