name: probe-cron

# ⚠️ 临时文件：仅用于验证 GitHub 调度器对本仓库是否有效。
#    `*/5 * * * *` 每 5 分钟触发一次，跑一个 echo 步骤（约 5 秒）。
#    验证完请立即删除本文件（删除后对应计划任务随之注销）。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 打印触发信息
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u '+utc=%Y-%m-%d %H:%M:%S'
